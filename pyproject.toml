# Python package scs_qmbboot: ctypes bindings to the solver libraries built
# by python/CMakeLists.txt. On Linux it has the MKL Gram and QDLDL backends
# and builds against MKL:
#
#   MKLROOT=$CONDA_PREFIX pip install .
#
# On macOS it has the Accelerate and QDLDL backends.

[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=10"]
build-backend = "scikit_build_core.build"

[project]
name = "scs-qmbboot"
dynamic = ["version"]
description = "Splitting conic solver for quantum many-body bootstrap SDPs"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Brendan O'Donoghue", email = "bodonoghue85@gmail.com" }]
maintainers = [{ name = "Xu-Cheng Wang", email = "jefferywangsh@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/JefferyWangSH/scs-qmbboot"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.22"
wheel.packages = ["python/scs_qmbboot"]
# ctypes, no Python C API: one wheel for every Python 3
wheel.py-api = "py3"
# only the libraries of the package, not the C library install
install.components = ["python"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

# version 0.1.dev<commits>+g<hash>: git describe ignores all tags
[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long",
                    "--abbrev=40", "--exclude", "*"]

[tool.scikit-build.cmake.define]
USE_OPENMP = "ON"

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
build.targets = ["scsdir", "scsmklgram"]

[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
build.targets = ["scsdir", "scsaccel"]
cmake.define.USE_APPLE_ACCELERATE = "ON"
